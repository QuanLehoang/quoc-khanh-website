<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Không tìm thấy trang | Quốc Khánh Việt Nam</title>
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#DA251D" />
    <link rel="icon" href="/test/images/favicon.ico" />
    <link rel="apple-touch-icon" href="/test/images/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&family=Montserrat:wght@700;900&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at 20% 15%, rgba(255, 205, 0, 0.22), transparent 32%),
          linear-gradient(135deg, #da251d, #8f100f 62%, #181818);
        color: #fff8f5;
        font-family: "Be Vietnam Pro", system-ui, sans-serif;
      }
      main {
        width: min(680px, 100%);
        border: 1px solid rgba(255, 205, 0, 0.24);
        border-radius: 8px;
        padding: clamp(28px, 7vw, 64px);
        background: rgba(255, 255, 255, 0.12);
        box-shadow: 0 30px 90px rgba(0, 0, 0, 0.26);
        text-align: center;
        backdrop-filter: blur(18px);
      }
      .mark {
        display: inline-grid;
        width: 72px;
        height: 72px;
        place-items: center;
        border-radius: 50%;
        background: #da251d;
        color: #ffcd00;
        font-size: 2.3rem;
      }
      h1 {
        margin: 24px 0 12px;
        font-family: Montserrat, sans-serif;
        font-size: clamp(2.4rem, 10vw, 5rem);
        line-height: 1;
      }
      p {
        margin: 0 auto 28px;
        max-width: 520px;
        color: rgba(255, 248, 245, 0.86);
        line-height: 1.7;
      }
      a {
        display: inline-flex;
        min-height: 50px;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        padding: 0 24px;
        background: linear-gradient(135deg, #ffcd00, #fff1a8);
        color: #6d0c0a;
        font-weight: 800;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 3px solid #fff8f5;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <span class="mark" aria-hidden="true">★</span>
      <h1>404</h1>
      <p>Trang bạn đang tìm không tồn tại hoặc đã được chuyển đến địa chỉ khác. Hãy quay lại trang chủ để tiếp tục khám phá tinh thần Quốc Khánh Việt Nam.</p>
      <a href="/test/">Về trang chủ</a>
    </main>
  </body>
</html>
